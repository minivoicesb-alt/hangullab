const readings=[
{title:'Текст 1 · TOPIK 2 · Учёба',body:'지수와 민호는 같은 대학에서 공부하지만 공부하는 방법은 다르다. 지수는 아침 일찍 도서관에 가는 반면에 민호는 저녁에 집에서 공부한다. 지수는 계획표를 자세히 만드는 반면에 민호는 그날 할 일을 간단히 정한다. 시험 기간에는 지수가 혼자 집중하는 것을 좋아하는 반면에 민호는 친구와 문제를 풀며 공부한다. 두 사람은 성격도 다르다. 지수는 발표할 때 긴장하는 반면에 민호는 사람들 앞에서 말하는 것을 즐긴다. 하지만 서로의 방법을 틀렸다고 생각하지 않는다. 지수는 민호에게서 즉흥적으로 문제를 해결하는 방법을 배우고, 민호는 지수의 계획표를 참고한다. 이번 학기 두 사람은 함께 공부 모임을 만들었다. 모임에서는 각자 편한 방식을 유지하면서 서로 다른 생각을 함께 비교한다. 두 학생은 방법이 다를수록 배울 점도 많다고 말한다.',qs:[q('민호는 주로 언제 공부하나요?',['저녁에 집에서 공부해요.','아침 일찍 도서관에 가요.','시험 전날만 공부해요.','항상 친구와 도서관에서 공부해요.'],0,'첫 부분에서 민호의 공부 시간과 장소를 말합니다.','','지수와 민호의 습관을 구분하세요.'),q('본문에서 반면에가 하는 일은?',['두 학생의 서로 다른 습관과 특성을 비교해요.','조건을 가정해요.','사건의 원인을 말해요.','한 학생의 실수를 지적해요.'],0,'각 절에서 두 학생의 상반된 방식을 짝지어 보여 줍니다.','','양보가 아니라 비교입니다.'),q('공부 모임이 두 사람에게 도움이 되는 이유는?',['서로 다른 방법을 공유하고 배울 수 있어서.','둘 다 같은 방식으로 공부해서.','민호가 지수의 계획을 대신 세워서.','시험을 치르지 않아도 돼서.'],0,'서로 방식이 달라 배우는 점이 많다고 합니다.','','차이를 장점으로 활용합니다.')]},
{title:'Текст 2 · TOPIK 3 · Покупки онлайн',body:'최근 소비자들은 온라인 쇼핑과 동네 가게를 함께 이용한다. 온라인 쇼핑은 가격을 쉽게 비교할 수 있는 반면에 물건을 직접 만져 볼 수 없다. 동네 가게는 상품을 바로 확인할 수 있는 반면에 선택지가 적거나 가격이 높을 때가 있다. 젊은 소비자는 휴대전화로 주문하는 경우가 많은 반면에 일부 어르신은 직원에게 설명을 듣고 구매하기를 편하게 느낀다. 그렇다고 한 방식이 모두에게 더 좋다고 말하기는 어렵다. 책이나 생활용품은 온라인으로 사는 사람이 많은 반면에 신발과 옷은 매장에서 직접 신어 본 뒤 사려는 사람도 많다. 가게 주인들은 온라인 주문을 시작하는 한편 매장 상담도 유지한다. 소비자들은 시간과 상품의 종류에 따라 다른 방법을 선택한다. 중요한 것은 광고만 보고 결정하기보다 반품 조건과 배송 날짜도 확인하는 일이다. 편리함은 서로 다르게 나타나므로 자신에게 맞는 방식을 고르는 것이 좋다.',qs:[q('온라인 쇼핑의 한계로 언급된 것은?',['물건을 직접 만져 볼 수 없어요.','가격을 비교할 수 없어요.','배송 날짜를 알 수 없어요.','상품 종류가 항상 적어요.'],0,'온라인 쇼핑의 편리함과 함께 촉감 확인의 어려움을 말합니다.','','다른 특징은 본문과 다릅니다.'),q('반면에가 비교하는 두 가지는?',['온라인 쇼핑과 동네 가게의 장단점.','젊은 세대와 계절.','광고와 반품 날짜.','책과 배송 직원.'],0,'각 구매 방식의 서로 다른 이점을 대비합니다.','','특정 방식이 모두에게 낫다고 결론내리지 않습니다.'),q('글의 결론을 가장 잘 요약하면?',['상품과 상황에 맞춰 구매 방법을 선택하자.','모든 구매를 온라인으로 바꾸자.','동네 가게는 곧 사라질 것이다.','광고만 보고 상품을 사자.'],0,'시간과 상품 종류에 따라 다른 방법을 선택하라고 합니다.','','본문은 한쪽 방식만 권하지 않습니다.')]},
{title:'Текст 3 · TOPIK 4 · Городская мобильность',body:'한 도시의 교통 연구팀은 시민들의 이동 자료를 조사했다. 중심 지역은 지하철 노선이 촘촘한 반면에 외곽 지역은 버스에 의존하는 주민이 많았다. 출근 시간에는 대중교통 이용자가 늘어나는 반면에 늦은 밤에는 택시 이용 비율이 높아졌다. 젊은 층은 공유 자전거를 자주 이용하는 반면에 어린 자녀가 있는 가정은 자동차를 선호하는 경우가 많았다. 연구팀은 어느 교통수단이 항상 더 낫다고 판단하지 않았다. 자전거는 짧은 거리를 이동하기에 편리한 반면에 비가 오거나 짐이 많으면 불편할 수 있다. 버스는 여러 동네를 연결하는 반면에 도로가 막히면 도착 시간이 달라진다. 보고서는 지역별로 필요한 교통 정책이 다르다고 강조했다. 중심 지역에는 보행 공간을 넓히고 외곽에는 배차 간격을 줄이는 방안을 제안했다. 연구팀은 이동 습관의 차이를 고려해야 모두가 편하게 이동할 수 있다고 설명했다.',qs:[q('외곽 지역 주민은 주로 어떤 대중교통에 의존하나요?',['버스','지하철','공유 자전거','택시만'],0,'본문에서 외곽 지역은 버스에 의존한다고 합니다.','','중심 지역은 지하철 노선이 촘촘합니다.'),q('문법적으로 반면에가 하는 역할은?',['지역·시간·집단별로 다른 이동 특성을 대조한다.','교통수단의 사용 조건을 가정한다.','교통 체증의 원인을 모두 설명한다.','연구 결과에 대한 감정을 표현한다.'],0,'여러 대조쌍을 제시해 차이를 구조화합니다.','','중립적인 비교이며 감정적 양보는 아닙니다.'),q('보고서가 중심과 외곽에 다른 정책을 제안한 까닭은?',['지역마다 이동 여건과 필요한 교통수단이 다르기 때문.','모든 시민이 자동차를 선호해서.','버스와 지하철이 똑같아서.','연구 자료가 없어서.'],0,'지역별 교통 특성에 맞춘 대책을 제시합니다.','','글은 차이를 고려하라고 강조합니다.')]}
];data.texts=readings.flatMap(r=>r.qs);
const stories=[
{title:'Мини-история 1 · Два соседа',body:'같은 층에 사는 은지와 도현은 생활 습관이 다르다. 은지는 아침에 일찍 일어나는 반면에 도현은 밤늦게까지 책을 읽는다. 은지는 집을 깔끔하게 정리하는 반면에 도현은 필요한 물건을 책상 위에 두는 편이다. 어느 날 건물의 정전으로 엘리베이터가 멈췄다. 은지는 계단을 천천히 내려가는 반면에 도현은 손전등을 찾아 이웃들에게 나누어 주었다. 두 사람은 서로 다른 방식으로 문제를 해결했다. 그날 이후 은지는 도현의 손전등을 빌리고, 도현은 은지에게 정리 방법을 배웠다.',qs:[q('은지는 보통 몇 시에 일어나나요?',['아침 일찍','밤늦게','정오','정해진 시간이 없어요.'],0,'본문 첫 문장에서 은지와 도현의 습관을 비교합니다.','','밤늦게 책을 읽는 사람은 도현입니다.'),q('정전 때 두 사람의 행동은 어떻게 달랐나요?',['은지는 계단을 내려가고 도현은 손전등을 나눴어요.','둘 다 엘리베이터를 고쳤어요.','도현이 계단을 내려가고 은지는 잠들었어요.','둘 다 건물을 떠났어요.'],0,'서로 다른 행동을 반면에로 대조합니다.','','두 역할을 바꾸지 마세요.'),q('이야기에서 반면에의 기능은?',['두 이웃의 다른 습관과 대응 방식을 나란히 보여 준다.','한 이웃이 다른 이웃보다 낫다고 비난한다.','정전이 일어날 조건을 말한다.','시간 순서만 표시한다.'],0,'비교가 이야기의 중심 장치입니다.','','우열이나 조건을 뜻하지 않습니다.')]},
{title:'Мини-история 2 · Книжный клуб',body:'수아와 태오는 동네 책 모임에서 만났다. 수아는 소설을 읽을 때 인물의 감정을 중요하게 보는 반면에 태오는 사건의 구조를 먼저 살핀다. 같은 책을 읽어도 두 사람의 감상은 자주 달랐다. 토론에서 수아는 주인공의 선택이 외로움 때문이라고 말한 반면에 태오는 그 선택이 사회적 압력과 관련 있다고 설명했다. 처음에는 서로의 의견을 이해하기 어려웠지만 다른 해석을 들을수록 책이 더 흥미로워졌다. 다음 모임에서 두 사람은 한 장면을 각자의 관점으로 발표하기로 했다. 책 모임 회원들은 서로 다른 독서 방식 덕분에 놓친 부분을 발견한다고 말했다.',qs:[q('수아는 소설에서 무엇을 중요하게 보나요?',['인물의 감정','사건 구조','책의 가격','작가의 사진'],0,'첫 문장에서 독서 관점을 설명합니다.','','사건 구조를 먼저 보는 사람은 태오입니다.'),q('같은 주인공의 선택을 두 사람은 어떻게 해석했나요?',['수아는 외로움, 태오는 사회적 압력을 강조했어요.','둘 다 가격 때문이라고 했어요.','수아는 사회 압력, 태오는 외로움이라고 했어요.','두 사람 모두 의견을 내지 않았어요.'],0,'두 해석을 반면에가 대조합니다.','','관점을 바꾸어 읽지 마세요.'),q('모임에서 서로 다른 관점이 준 결과는?',['책에서 놓친 부분을 발견하게 했어요.','토론을 중단하게 했어요.','같은 해석만 남게 했어요.','책을 읽지 않게 했어요.'],0,'다른 해석이 독서 경험을 풍부하게 합니다.','','차이를 생산적으로 활용합니다.')]},
{title:'Мини-история 3 · Семейная поездка',body:'가족은 주말에 산으로 여행을 갔다. 아버지는 일찍 출발하는 것을 좋아하는 반면에 어머니는 아침을 천천히 준비하는 편이다. 누나는 사진을 많이 찍는 반면에 동생은 풍경을 눈으로 보는 것을 더 좋아했다. 차가 산길에 들어서자 날씨가 흐려졌다. 아버지는 계획한 전망대에 가자고 했지만 어머니는 비가 올 수 있으니 먼저 작은 박물관을 방문하자고 제안했다. 가족은 박물관에서 지역의 역사를 배운 뒤 비가 그치자 전망대로 올라갔다. 서로 다른 취향이 있었지만 일정은 모두가 즐길 수 있게 바뀌었다. 돌아오는 길에 가족은 다음 여행에서는 각자 원하는 활동을 하나씩 고르기로 했다.',qs:[q('어머니의 아침 습관은?',['천천히 준비해요.','항상 가장 먼저 출발해요.','사진을 많이 찍어요.','전망대에서 기다려요.'],0,'아버지와 어머니의 습관이 대조됩니다.','','일찍 출발하는 사람은 아버지입니다.'),q('날씨가 흐려졌을 때 어머니는 무엇을 제안했나요?',['먼저 작은 박물관에 가요.','여행을 취소해요.','바로 집으로 돌아가요.','차에서 기다려요.'],0,'비가 올 수 있어 박물관을 먼저 방문하자고 합니다.','','이후 비가 그쳐 전망대에도 갑니다.'),q('가족은 서로 다른 취향을 어떻게 다뤘나요?',['일정을 바꾸고 다음에는 각자 활동을 고르기로 했어요.','한 사람의 계획만 따랐어요.','여행을 다시 가지 않기로 했어요.','사진 촬영을 금지했어요.'],0,'모두가 즐길 수 있도록 조정했습니다.','','차이를 조율하는 결말입니다.')]},
{title:'Мини-история 4 · Два способа работать',body:'작은 디자인 회사의 현수와 나리는 같은 프로젝트를 맡았다. 현수는 먼저 전체 계획을 세우는 반면에 나리는 여러 시안을 빠르게 만들어 본다. 현수는 색을 적게 쓰는 반면에 나리는 밝은 색을 과감하게 사용한다. 고객은 차분한 화면을 원한다고 말했지만 제품이 눈에 띄기를 바랐다. 두 사람은 각자의 초안을 비교하고 장점을 합쳤다. 최종 디자인은 구조가 단순한 반면에 중요한 버튼은 선명한 색으로 강조되었다. 고객은 사용하기 쉽고 기억에도 남는다고 평가했다. 팀장은 서로 다른 작업 방식이 좋은 결과로 이어졌다고 말했다.',qs:[q('현수는 일을 어떻게 시작하나요?',['먼저 전체 계획을 세워요.','시안을 많이 만들어요.','밝은 색부터 고릅니다.','고객에게 결정을 맡겨요.'],0,'첫 문장에서 두 디자이너 방식을 비교합니다.','','빠르게 여러 안을 만드는 사람은 나리입니다.'),q('최종 디자인의 특징은?',['구조는 단순하고 중요한 버튼은 선명해요.','모든 요소가 복잡하고 회색이에요.','버튼을 없앴어요.','초안을 그대로 하나만 썼어요.'],0,'반면에로 구조와 버튼 색을 대조해 설명합니다.','','두 사람 장점을 합쳤습니다.'),q('팀장이 말한 결과의 이유는?',['다른 작업 방식의 장점을 결합해서.','두 사람이 똑같이 작업해서.','고객 의견을 무시해서.','색을 하나도 쓰지 않아서.'],0,'상반된 방식을 비교하고 결합한 것이 도움이 됐습니다.','','다름이 협업의 자원이 됐습니다.')]},
{title:'Мини-история 5 · Переезд в город',body:'유학생 라라는 작은 도시에서 서울로 이사했다. 고향에서는 버스를 기다리는 시간이 긴 반면에 서울에서는 지하철을 자주 이용할 수 있었다. 작은 도시에서는 이웃을 쉽게 만나는 반면에 서울에서는 아파트 문을 닫으면 이웃과 마주칠 일이 적었다. 라라는 처음에 큰 도시가 편리하다고 생각했지만 가끔 외롭기도 했다. 학교 동아리에 가입한 뒤에는 다양한 나라의 친구를 만났다. 친구 중 한 명은 한국 음식을 잘 아는 반면에 라라는 고향 요리를 소개했다. 함께 음식을 만들면서 서로의 생활 이야기를 나누었다. 라라는 도시의 빠른 생활과 이웃의 따뜻함을 모두 경험하며 새 환경에 적응했다.',qs:[q('라라는 작은 도시에서 어떤 불편을 느꼈나요?',['버스를 오래 기다렸어요.','지하철이 너무 자주 왔어요.','이웃을 전혀 만나지 못했어요.','아파트가 많았어요.'],0,'고향과 서울의 교통이 대조됩니다.','','서울에서는 지하철을 자주 이용합니다.'),q('친구와 라라는 음식에 대해 어떻게 달랐나요?',['친구는 한국 음식을 알고 라라는 고향 요리를 소개했어요.','둘 다 같은 요리만 만들었어요.','라라가 한국 음식을 가르쳤어요.','친구가 고향 음식을 싫어했어요.'],0,'서로 다른 음식 지식을 교환합니다.','','본문에서 역할을 확인하세요.'),q('라라가 새 환경에 적응하는 데 도움이 된 것은?',['동아리 친구들과 교류하며 서로의 이야기를 나눈 것.','이웃과 절대 만나지 않은 것.','서울 생활을 포기한 것.','버스만 이용한 것.'],0,'동아리에서 친구를 만나 함께 요리하고 이야기합니다.','','두 문화가 교류의 계기가 됩니다.')]}
];data.stories=stories.flatMap(s=>s.qs);
const boss=[
q('두 직원을 비교: 민지는 꼼꼼히 계획하고 준호는 즉흥적으로 움직인다.',['민지는 계획을 꼼꼼히 세우는 반면에 준호는 즉흥적으로 행동해요.','민지는 계획을 세우더라도 준호는 즉흥적으로 행동해요.','민지는 계획을 세우기는 하지만 준호는 행동해요.','민지는 계획을 세워서 준호는 즉흥적이에요.'],0,'두 주체의 습관을 직접 비교합니다.','','더라도는 조건, 기는 하지만은 양보.'),
q('«가게는 작지만 제품이 다양하다»라는 양보보다 두 장소의 대비를 강조하려면?',['이 가게는 작은 반면에 맞은편 매장은 제품이 다양해요.','가게는 작기는 하지만 제품이 다양해요.','가게가 작더라도 제품은 다양해요.','가게가 작아서 제품이 다양해요.'],0,'가게와 매장이라는 두 대상을 나란히 비교합니다.','','다른 답은 한 대상의 양보나 원인.'),
q('과거 사실 비교: 어제는 바람이 강했고 오늘은 잔잔하다.',['어제는 바람이 강했던 반면에 오늘은 잔잔해요.','어제는 바람이 강한 반면에 오늘은 잔잔했어요.','어제 바람이 강하더라도 오늘은 잔잔해요.','어제 바람이 강해서 오늘은 잔잔해요.'],0,'어제의 상태는 과거 관형형 강했던으로 표시합니다.','','시제 대응이 핵심.'),
q('명사형 완성: 우리 팀은 기획자, 상대 팀은 개발자 중심이다.',['우리 팀은 기획자가 많은 반면에 상대 팀은 개발자가 많아요.','우리 팀은 기획자는 반면에 상대 팀은 개발자예요.','우리 팀은 기획하더라도 상대 팀은 개발해요.','우리 팀은 기획자라서 상대 팀은 개발자예요.'],0,'사람 수의 두 특성을 대조합니다.','','명사 뒤에 은을 바로 붙이지 않습니다.'),
q('두 통계 추세의 중립적 대조에 가장 적절한 문장은?',['광고비는 감소하는 반면에 신규 가입은 늘었습니다.','광고비는 감소하더라도 신규 가입은 늘었습니다.','광고비는 감소하기는 하지만 신규 가입은 늘었습니다.','광고비가 감소해서 신규 가입은 늘었습니다.'],0,'두 지표를 대조하는 보고서 문장입니다.','','원인이나 양보가 핵심은 아닙니다.'),
q('오류 수정: «이 방은 조용는 반면에 복도는 시끄럽다.»',['이 방은 조용한 반면에 복도는 시끄럽다.','이 방은 조용하는 반면에 복도는 시끄럽다.','이 방은 조용더라도 복도는 시끄럽다.','문장에 오류가 없다.'],0,'조용하다 — 형용사이므로 조용한 반면에.','','-는은 동사에 사용.'),
q('회의 대화: A는 짧게 요점만 말하고 B는 배경부터 길게 설명한다.',['A는 요점부터 말하는 반면에 B는 배경을 자세히 설명해요.','A는 말하더라도 B는 설명해요.','A는 짧게 말하기는 하지만 B는 설명해요.','A는 짧게 말해서 B는 길어요.'],0,'두 사람의 의사소통 방식을 비교합니다.','','두 주체가 명시된 대조.'),
q('둘 중 하나: 실제로 비가 오면 행사를 옮기기로 했다. 어떤 문법이 적절한가?',['비가 오면 행사 장소를 옮길 거예요.','비가 오는 반면에 행사 장소를 옮길 거예요.','비가 오는 기는 하지만 장소를 옮겨요.','비가 온 반면에 장소를 옮겨요.'],0,'조건을 정하는 문맥이라 반면에가 아니라 -면.','','비가 오는 상황을 비교하는 대상이 없습니다.'),
q('«기숙사는 학교와 가깝고 원룸은 사생활이 편하다»의 자연스러운 대비?',['기숙사는 학교와 가까운 반면에 원룸은 사생활을 지키기 편해요.','기숙사는 학교와 가깝더라도 원룸은 사생활이 편해요.','기숙사는 학교와 가까워서 원룸은 사생활이 편해요.','기숙사는 가까운 기는 하지만 원룸은 편해요.'],0,'두 주거 형태의 서로 다른 장점을 대조합니다.','','원인·가정 아님.'),
q('«도시의 인구는 늘어나는 반면에 농촌 인구는 줄었다» 해석은?',['도시 인구는 증가 추세, 농촌 인구는 감소 추세다.','도시 인구가 늘어서 농촌 인구가 줄었다.','도시 인구가 늘더라도 농촌 인구는 줄 것이다.','도시 인구가 먼저 늘고 나중에 농촌이 줄었다.'],0,'두 집단의 반대되는 추세를 말합니다.','','문장 자체는 인과나 시간 순서를 말하지 않습니다.'),

q('어떤 문장이 배경 설명 -는데가 더 자연스러운가?',['제가 자료를 정리하고 있는데 팀장님이 새 요청을 보냈어요.','저는 계획적인 반면에 동료는 즉흥적이에요.','어제는 따뜻한 반면에 오늘은 추워요.','서울은 복잡한 반면에 바다는 조용해요.'],0,'첫 문장은 진행 중인 배경 상황을 도입합니다.','','나머지는 비교 대상이 분명해 반면에.'),

let st={section:'theory',idx:0,answers:{},wrong:[],mode:'normal',sel:null};try{let z=JSON.parse(localStorage.getItem('hangul-lab-banmyeon-v1'));if(z&&z.answers)st={...st,...z,section:'theory',idx:0,mode:'normal',sel:null}}catch(e){}const $=s=>document.querySelector(s);function save(){try{localStorage.setItem('hangul-lab-banmyeon-v1',JSON.stringify(st))}catch(e){}}function done(){return Object.keys(st.answers).length}function update(){let p=Math.round(done()/total*100);$('#fill').style.width=p+'%';$('#pct').textContent=p+'%';$('#score').textContent=`${done()} / ${total} заданий`;$('#sideProgress').textContent=`Проверено ${done()} из ${total} вопросов`}function sectionComplete(id){let a=data[id]||[];return id!=='theory'&&id!=='review'&&a.length>0&&a.every((_,i)=>!!st.answers[id+String.fromCharCode(58)+i])}function nextSection(){let i=sections.findIndex(x=>x[0]===st.section),n=sections.slice(i+1).find(x=>x[0]!=='review');if(n)go(n[0]);else if(st.wrong.length)go('review');else location.href='index.html'}function nav(){let n=$('#nav');n.innerHTML='';sections.forEach(([id,name,count])=>{let b=document.createElement('button');b.className=st.section===id?'active':'';b.innerHTML=`${sectionComplete(id)?'✓ ':''}${name}<small>${id==='review'?st.wrong.length:count}</small>`;b.onclick=()=>go(id);n.append(b)})}function go(id){st.section=id;st.idx=0;st.mode='normal';st.sel=null;if(id==='review')st.review=[...st.wrong];save();nav();render();window.scrollTo({top:0,behavior:'smooth'})}function key(s,i){return s+':'+i}function list(){if(st.mode==='review')return st.review.map(k=>{let [s,i]=k.split(':');return{s,i:+i,q:data[s][+i]}});return(data[st.section]||[]).map((q,i)=>({s:st.section,i,q}))}
function theory(){return `<section class="panel"><span class="tag">Смысл и употребление</span><h2>Сопоставить две стороны</h2><p class="lead"><b>-(으)ㄴ/는 반면에</b> прямо сопоставляет два предмета, человека, периода или аспекта: «тогда как…», «в то время как…», «с другой стороны…». Часто конструкция показывает различие или противоположные характеристики. В отличие от уступки, контраст сам по себе не обязательно означает «это правда, но…».</p><div class="cols"><article class="card"><h3>Когда и зачем</h3><p>В сравнении людей и групп, товаров и услуг, регионов, периодов, тенденций, достоинств и ограничений. Часто части симметричны: в одной речь о A, в другой — о B.</p><p><b>Оттенок:</b> обычно нейтральное, ясное сопоставление. Может обозначить различие в одной теме, но не требует удивления или несогласия.</p></article><article class="card"><h3>Формула</h3><div class="formula">основа + -(으)ㄴ/는 반면에</div><p><b>Глагол, настоящее:</b> 일하다 → 일하는 반면에<br><b>Глагол, прошедшее:</b> 증가하다 → 증가한 반면에<br><b>Прилагательное:</b> 높다 → 높은 반면에; 작다 → 작은 반면에<br><b>Существительное:</b> 학생 → 학생인 반면에; 의사 → 의사인 반면에<br><b>Отрицательная оценка:</b> 편리하지 않은 반면에. В письменной речи нередко используется 반면.</p></article></div><h3>Не путайте</h3><div class="grid"><article class="card"><b>-지만</b><p>Общее «но», часто соединяет две части в одном предложении. Подходит для простого контраста; 반면에 сильнее организует параллельное сравнение двух сторон.</p></article><article class="card"><b>-기는 하지만</b><p>«Да, это так, однако…»: признаёт один факт и добавляет уступительную оговорку. 반면에 прежде всего сравнивает две стороны, а не подчёркивает уступку.</p></article><article class="card"><b>-는데</b><p>Часто задаёт фон, вводит пояснение или мягкий переход. Может передавать контраст по контексту, но не всегда явно оформляет пару сравнения.</p></article><article class="card"><b>-더라도</b><p>«Даже если…»: гипотетическое/обобщённое условие. 비가 오더라도 갈 거예요 — даже если пойдёт дождь, пойду. Это не сравнение фактических сторон.</p></article></div><h3>Формы и ограничения</h3><p>С глаголами настоящего времени используйте <b>-는 반면에</b>; с прилагательными — <b>-(으)ㄴ 반면에</b>; с существительными — <b>인 반면에</b>. Для завершённого действия или состояния обычно берите прошедшую определительную форму: <b>만난 반면에</b>, <b>많았던 반면에</b>. В двух частях должна быть понятная основа для сравнения. Если говорите об одном минусе и своём выводе, часто точнее -기는 하지만.</p><h3>Примеры</h3><div class="grid">${examples.map(x=>`<article class="card"><div class="ko">${x[0]}</div><div>${x[1]}</div><div class="muted">${x[2]}</div></article>`).join('')}</div><div class="actions"><button class="btn primary" onclick="go('warm')">Начать разминку →</button></div></section>`}
function render(){update();nav();let c=$('#content');if(st.section==='theory'){c.innerHTML=theory();return}if(st.section==='review'){st.mode='review';if(!st.wrong.length){c.innerHTML='<section class="panel"><h2>Ошибок для повтора нет 🎉</h2><p>Неправильные ответы будут собираться автоматически.</p><button class="btn primary" onclick="go(\'warm\')">К разминке</button></section>';return}}if(st.section==='texts'||st.section==='stories'){special(c);return}question(c)}function question(c){let a=list();if(!a.length){c.innerHTML='<section class="panel"><h2>В этом разделе пока нет заданий.</h2></section>';return}st.idx=Math.min(st.idx,a.length-1);let it=a[st.idx],k=key(it.s,it.i),saved=st.answers[k],x=it.q;c.innerHTML=`<section class="panel"><div class="qhead"><span class="tag">${st.mode==='review'?'Повтор ошибок':sections.find(s=>s[0]===st.section)[1]}</span><span class="muted">${st.idx+1} из ${a.length}</span></div><p class="muted">${x.ctx||'Выберите наиболее естественный вариант с учётом контекста.'}</p><div class="prompt">${x.prompt}</div><div class="choices">${x.opts.map((o,i)=>`<button class="choice ${saved?(i===x.ans?'correct':i===saved.pick?'wrong':''):''} ${!saved&&st.sel===i?'selected':''}" ${saved?'disabled':''} onclick="pick(${i})"><span class="letter">${'ABCD'[i]}</span><span>${o}</span></button>`).join('')}</div>${saved?`<div class="feedback ${saved.ok?'good':'bad'}"><h3>${saved.ok?'Верно!':'Разберём нюанс.'}</h3><p><b>Ответ:</b> ${x.opts[x.ans]}</p><p>${x.why}</p>${x.near?`<p><b>Почему близкие варианты менее уместны:</b> ${x.near}</p>`:''}</div>`:''}<div class="actions"><button class="btn ghost" onclick="prev()" ${st.idx===0?'disabled':''}>← Назад</button>${saved?`<button class="btn primary" onclick="next()">${st.idx===a.length-1?'Итог':'Дальше →'}</button>`:`<button class="btn primary" onclick="check()" ${st.sel===null?'disabled':''}>Проверить</button>`}<button class="btn secondary" onclick="go('review')">Повторить ошибки (${st.wrong.length})</button></div></section>`}function pick(i){st.sel=i;render()}function grade(s,i,x,p){let k=key(s,i),ok=p===x.ans;st.answers[k]={pick:p,ok};st.wrong=st.wrong.filter(y=>y!==k);if(!ok)st.wrong.push(k);st.sel=null;save();render()}function check(){let it=list()[st.idx];if(it&&st.sel!==null)grade(it.s,it.i,it.q,st.sel)}function prev(){if(st.idx>0){st.idx--;st.sel=null;render()}}function next(){let a=list();if(st.idx<a.length-1){st.idx++;st.sel=null;render()}else if(st.mode==='review'){$('#content').innerHTML=`<section class="panel"><h2>Повтор завершён</h2><div class="actions"><button class="btn primary" onclick="go('warm')">Продолжить урок</button><a class="btn ghost" href="index.html">Все темы</a></div></section>`}else{$('#content').innerHTML=`<section class="panel"><span class="tag">✓ Раздел пройден</span><h2>Хорошая работа!</h2><p>Все задания раздела завершены.</p><div class="actions"><button class="btn primary" onclick="nextSection()">Перейти к следующему разделу →</button><button class="btn secondary" onclick="go('review')">Повторить ошибки (${st.wrong.length})</button></div></section>`}}function special(c){let texts=st.section==='texts',arr=texts?readings:stories,ix=Math.floor(st.idx/3),sub=st.idx%3,e=arr[ix],x=e.qs[sub],i=ix*3+sub,s=st.section,saved=st.answers[key(s,i)];c.innerHTML=`<section class="panel"><div class="qhead"><span class="tag">${e.title}</span><span class="muted">${st.idx+1} из ${arr.length*3}</span></div><div class="textblock" lang="ko">${e.body}</div><p class="muted">Вопросы: факт · функция грамматики · вывод или скрытый смысл</p><div class="prompt">${x.prompt}</div><div class="choices">${x.opts.map((o,n)=>`<button class="choice ${saved?(n===x.ans?'correct':n===saved.pick?'wrong':''):''} ${!saved&&st.sel===n?'selected':''}" ${saved?'disabled':''} onclick="pick(${n})"><span class="letter">${'ABCD'[n]}</span><span>${o}</span></button>`).join('')}</div>${saved?`<div class="feedback ${saved.ok?'good':'bad'}"><h3>${saved.ok?'Верно!':'Разберём ответ'}</h3><p><b>Ответ:</b> ${x.opts[x.ans]}</p><p>${x.why}</p><p><b>Другие варианты:</b> ${x.near}</p></div>`:''}<div class="actions"><button class="btn ghost" onclick="prev()" ${st.idx===0?'disabled':''}>← Назад</button>${saved?`<button class="btn primary" onclick="next()">${st.idx===arr.length*3-1?'Итог':'Дальше →'}</button>`:`<button class="btn primary" onclick="specialCheck()" ${st.sel===null?'disabled':''}>Проверить</button>`}<button class="btn secondary" onclick="go('review')">Ошибки (${st.wrong.length})</button></div></section>`}function specialCheck(){let arr=st.section==='texts'?readings:stories,ix=Math.floor(st.idx/3),sub=st.idx%3,x=arr[ix].qs[sub];if(st.sel!==null)grade(st.section,ix*3+sub,x,st.sel)}if(!st.shuffleV2){for(const [k,a] of Object.entries(st.answers||{})){const [sec,idx]=k.split(':');const x=(data[sec]||[])[Number(idx)];if(x){a.pick=a.ok?x.ans:(x.ans+1)%x.opts.length}}st.shuffleV2=true;save()}nav();render();
</script></body></html>
