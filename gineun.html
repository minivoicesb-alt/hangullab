{title:'Текст 1 · TOPIK 2 · Учёба',body:'민지는 대학에 입학한 뒤 학교 도서관을 자주 이용한다. 도서관은 집에서 가깝지는 않지만 자료가 많고 조용하기는 하지만 시험 기간에는 자리를 찾기가 어렵다. 그래서 민지는 아침 일찍 도착해 창가 자리에 앉는다. 처음에는 혼자 공부하는 것이 편하기는 했지만 모르는 내용을 바로 물어볼 사람이 없어서 답답했다. 이번 학기에는 같은 수업을 듣는 수아와 함께 공부한다. 수아는 설명을 잘하기는 하지만 가끔 말이 빨라서 민지는 메모를 부탁한다. 두 사람은 매주 금요일에 한 주 동안 배운 내용을 정리한다. 민지는 아직 발표가 부담스럽기는 하지만 작은 모임에서 연습한 뒤 자신감이 조금 생겼다. 다음 달에는 도서관 학습 발표회에 참가할 생각이다. 완벽하게 준비되지는 않았지만 배운 것을 나누는 경험이 도움이 될 것이라고 믿는다.',qs:[q('민지는 도서관에서 자리를 잡기 위해 어떻게 하나요?',['아침 일찍 도착해요.','시험이 끝난 뒤 가요.','수아에게 맡겨요.','집에서만 공부해요.'],0,'시험 기간 자리가 부족해 일찍 도착합니다.','','다른 내용은 나오지 않아요.'),q('이 글의 -기는 하지만은 주로 무슨 역할인가요?',['좋은 점을 인정하면서 제한을 덧붙여요.','시간 순서만 나열해요.','명령을 부드럽게 해요.','미래 조건을 가정해요.'],0,'편리함, 설명 능력 등을 인정한 뒤 제한을 보탭니다.','','-더라도의 조건 의미와 구별됩니다.'),q('민지가 발표회에 참가하려는 이유는?',['불완전해도 나누는 경험이 도움이 된다고 믿어서.','수아가 대신 발표하기로 해서.','자리가 남아서.','발표가 전혀 부담스럽지 않아서.'],0,'마지막 부분은 경험의 가치를 강조합니다.','','발표 부담은 아직 남아 있습니다.')]},
{title:'Текст 2 · TOPIK 3 · Малый бизнес',body:'동네 빵집을 운영하는 준호는 최근 배달 서비스를 시작했다. 주문이 늘기는 했지만 포장과 배달 수수료를 계산하면 수익이 기대만큼 크지 않다. 처음에는 온라인 홍보가 어렵기는 했지만 단골손님들이 사진과 후기를 공유해 주어 가게를 알리는 데 도움이 됐다. 준호는 모든 메뉴를 배달할 수 있게 하지는 않았다. 크림이 들어간 빵은 맛있기는 하지만 이동 중 모양이 쉽게 망가지기 때문이다. 대신 식어도 맛이 유지되는 빵을 따로 소개하고 포장 상자에 보관 방법을 적었다. 손님들은 편리하다고 말하기는 하지만 직접 가게에 와서 고르는 재미도 좋다고 한다. 그래서 준호는 배달을 확대하더라도 매장의 작은 시식 공간은 유지할 생각이다. 매출이 크게 늘지는 않았지만 손님과 대화할 기회가 많아져 어떤 제품을 개선해야 하는지 알게 됐다.',qs:[q('배달 메뉴에서 제외한 빵은?',['운송 중 모양이 망가지기 쉬운 크림빵.','식어도 맛있는 빵.','시식용 빵.','모든 인기 메뉴.'],0,'크림빵은 맛있지만 배달 중 모양이 손상됩니다.','','다른 선택지는 글과 다릅니다.'),q('«맛있기는 하지만»의 기능은?',['맛을 인정한 뒤 배달 부적합성을 덧붙여요.','맛있으면 반드시 배달한다는 조건.','맛있어서 모양이 망가진다는 원인.','맛이 없다는 뜻.'],0,'장점과 운송상의 약점을 함께 보여 줍니다.','','원인으로 읽으면 뒤와 맞지 않습니다.'),q('시식 공간을 유지하려는 이유를 추론하면?',['매장 경험과 대화도 가치 있다고 보기 때문.','배달을 중단하려고 해서.','수익이 크게 늘어서.','홍보가 실패해서.'],0,'직접 고르는 경험과 대화가 제품 개선에 도움 됩니다.','','두 판매 방식을 병행하려 합니다.')]},
{title:'Текст 3 · TOPIK 4 · Удалённая работа',body:'한 IT 회사는 출퇴근 시간을 줄이기 위해 주 3일 재택근무를 도입했다. 직원들은 집에서 일하는 것이 편리하기는 하지만 업무와 휴식의 경계가 흐려질 수 있다고 말했다. 특히 신입 직원은 질문이 생기기는 하지만 동료에게 바로 묻기가 망설여져 문제를 혼자 오래 붙잡는 경우가 있었다. 회사는 이를 해결하려고 매일 짧은 온라인 회의를 열고 질문 게시판도 만들었다. 회의는 도움이 되기는 하지만 참석자가 많으면 모두가 의견을 내기 어렵다는 지적도 나왔다. 그래서 팀마다 인원을 나누어 대화 시간을 운영한다. 관리자는 재택근무가 생산성을 높인다고 단정하기는 어렵지만 직원 만족도와 이직률을 함께 살펴보겠다고 밝혔다. 제도는 아직 완성되지 않았지만 회사는 한 달마다 설문 결과를 검토해 규칙을 조정할 예정이다. 직원들은 자유도가 높다는 점을 반기면서도 일과 삶을 구분할 기준이 필요하다고 강조했다.',qs:[q('신입 직원 지원을 위해 회사가 만든 것은?',['짧은 온라인 회의와 질문 게시판.','재택근무를 주 5일로 확대.','질문 금지 규칙.','출퇴근 시간 연장.'],0,'두 지원책이 본문에 적혀 있습니다.','','다른 선택지는 나오지 않습니다.'),q('«회의는 도움이 되기는 하지만» 다음 내용은?',['도움은 되지만 인원이 많으면 발언하기 어렵다.','도움이 되니 인원을 늘린다.','무의미해 폐지한다.','길면 생산성이 반드시 오른다.'],0,'효과를 인정하고 대규모 회의의 한계를 덧붙입니다.','','양보를 원인으로 바꾸지 마세요.'),q('관리자가 생산성 향상을 단정하지 않는 이유는?',['여러 지표를 더 관찰해야 해서.','제도를 폐지하기로 해서.','직원 모두 거부해서.','설문이 불가능해서.'],0,'초기 제도여서 월별 결과를 살피려 합니다.','','지속 평가를 선택합니다.')] }];
const stories=[
{title:'Мини-история 1 · Потерянный зонт',body:'수진은 퇴근길 지하철역에서 작은 우산을 발견했다. 우산은 낡기는 했지만 손잡이에 파란 리본이 묶여 있었다. 역무실에 맡기려다가 안쪽 이름을 보고 같은 건물에서 일하는 민호에게 전화했다. 민호는 우산을 잃어버린 줄도 몰랐다고 했다. 우산이 오래되기는 했지만 아버지가 준 선물이라는 이야기를 들었다. 다음 날 민호는 고맙다며 커피를 샀고 두 사람은 처음으로 점심을 함께 먹었다.',qs:[q('우산 주인은 누구였나요?',['민호','수진의 아버지','역무원','카페 직원'],0,'안쪽 이름을 보고 민호에게 연락했습니다.','','아버지는 선물한 사람입니다.'),q('낡은 우산이 중요한 이유는?',['아버지가 준 선물이어서요.','비싼 브랜드여서요.','수진이 새로 사 줘서요.','비가 오지 않아서요.'],0,'낡았기는 하지만 가족의 선물이라는 가치가 있습니다.','','이 대조가 감정적 핵심입니다.'),q('문법의 역할은?',['겉모습의 낡음과 개인적 가치를 대비해요.','우산을 찾으면 전화하라는 조건.','시간 순서만 표현.','민호가 우산을 싫어한다는 뜻.'],0,'상태를 인정하면서 소중함을 강조합니다.','','민호는 우산을 아낍니다.')]},
{title:'Мини-история 2 · Поздний поезд',body:'대학원생 현우는 학회 발표를 마치고 마지막 기차를 타러 갔다. 자료는 충분히 준비하기는 했지만 질문에 답하느라 늦게 역에 도착했다. 기차는 이미 출발했다. 그는 당황했지만 다음 역까지 가는 버스를 알아보았다. 버스는 느리기는 했지만 밤새 운행했고 현우는 집 근처에 도착했다. 다음 날 지도 교수는 발표가 완벽하지는 않았지만 핵심 주장은 분명했다고 말했다. 현우는 질문을 통해 배운 점을 기록하기로 했다.',qs:[q('현우가 기차를 놓친 이유는?',['질문에 답하느라 늦어서.','표를 사지 않아서.','버스가 먼저 출발해서.','발표를 취소해서.'],0,'질문 응답으로 예상보다 늦게 역에 왔습니다.','','다른 내용은 없습니다.'),q('버스에 대한 평가는?',['느리지만 밤새 다녀 집 근처까지 갔어요.','빠르지만 밤에 운행하지 않았어요.','비싸서 타지 않았어요.','직원이 운전했어요.'],0,'느림을 인정하고 지속 운행을 장점으로 봅니다.','','-기는 했지만과 비슷한 균형입니다.'),q('현우가 다음에 하기로 한 일은?',['질문에서 배운 점을 기록해요.','발표를 그만둬요.','기차를 다시 놓쳐요.','교수 말을 무시해요.'],0,'마지막 문장에서 행동을 밝힙니다.','','실수를 학습으로 이어 갑니다.')]},
{title:'Мини-история 3 · Тихий участник',body:'새 프로젝트 팀의 유나는 회의에서 거의 말하지 않았다. 팀원들은 준비가 부족한 줄 알았지만 유나는 자료를 꼼꼼히 읽기는 했지만 생각을 정리한 뒤 말하는 편이었다. 발표 날 인터넷 연결이 불안정해 화면 공유가 끊겼다. 유나는 당황하기는 했지만 미리 인쇄한 도표를 꺼내 설명을 이어 갔다. 발표는 화려하지는 않았지만 고객 질문에 정확히 답했다. 팀장은 분석 노트를 보고 다음 프로젝트에서도 함께하자고 제안했다. 유나는 자신의 방식도 팀에 도움이 된다는 것을 알게 됐다.',qs:[q('팀원들이 처음 오해한 것은?',['유나가 준비하지 않았다고 생각했어요.','유나가 발표를 맡았다고 생각했어요.','인터넷이 안정적이라고 생각했어요.','고객이 없다고 생각했어요.'],0,'조용함을 준비 부족으로 오해했습니다.','','이후 본문이 바로잡습니다.'),q('인터넷이 끊겼을 때 유나는?',['인쇄한 도표로 설명을 계속했어요.','발표를 취소했어요.','팀장을 불렀어요.','회의실을 나갔어요.'],0,'미리 준비한 종이 자료를 이용했습니다.','','당황했지만 대응했습니다.'),q('숨은 메시지는?',['조용한 준비도 팀 기여로 드러날 수 있어요.','말을 많이 해야 준비가 돼요.','기술 문제는 발표를 망쳐요.','질문에는 답할 필요가 없어요.'],0,'겉으로 보이는 말수와 실제 준비를 대비합니다.','','문법도 당황함과 대응을 대비합니다.')]},
{title:'Мини-история 4 · Рынок у моря',body:'여행객 다현은 바닷가 시장에서 유명한 해산물 식당을 찾았다. 가격은 비싸기는 했지만 창밖으로 바다가 보여 분위기가 좋았다. 생선구이는 맛있었지만 양이 적어 근처에서 주먹밥을 더 샀다. 상인은 관광객이 많기는 하지만 평일 아침에는 동네 주민도 자주 온다고 했다. 다현은 식당보다 시장 골목이 더 재미있다고 생각했다. 돌아가는 길에 비가 내렸지만 상인이 빌려준 우산 덕분에 역까지 걸었다. 다음에는 성수기에 오더라도 아침 일찍 시장을 둘러볼 계획이다.',qs:[q('생선구이 뒤에 추가로 산 것은?',['주먹밥','우산','커피','기념품'],0,'양이 적어서 주먹밥을 더 샀습니다.','','우산은 빌렸습니다.'),q('평일 아침 시장 특징은?',['관광객뿐 아니라 주민도 와요.','모든 가게가 닫아요.','비가 오지 않아요.','식당이 무료예요.'],0,'상인이 주민 방문도 언급합니다.','','관광객과 주민을 함께 말합니다.'),q('성수기에 오더라도의 역할은?',['불리한 조건에도 아침 방문 계획을 유지해요.','성수기에 이미 왔다는 뜻.','아침 시장이 닫는다는 뜻.','여행을 취소해요.'],0,'더라도는 앞으로의 양보 조건을 표시합니다.','','미래 조건이라 더라도가 맞습니다.')]},
{title:'Мини-история 5 · Телефонное интервью',body:'지호는 해외 회사의 전화 면접을 앞두고 메모를 준비했다. 회사 제품은 혁신적이기는 하지만 고객 지원이 느리다는 후기도 있었다. 그는 단점을 숨기기보다 개선 아이디어를 말하기로 했다. 통화 연결이 좋지 않아 질문을 몇 번 다시 들어야 했지만 천천히 확인하고 답했다. 경력은 길지 않기는 했지만 작은 팀에서 고객 문의를 직접 처리한 경험이 있었다. 면접관은 구체적 사례를 물었고 지호는 한 고객의 문제를 해결한 일을 설명했다. 통화 뒤 그는 완벽하게 답하지는 못했지만 경험을 솔직히 전달했다고 느꼈다.',qs:[q('제품에 대한 후기는?',['혁신적이지만 지원이 느리다는 점.','무료라는 점.','면접 취소.','지원이 항상 빠르다는 점.'],0,'장점과 고객 지원 관련 단점을 함께 살핍니다.','','다른 정보는 없습니다.'),q('지호의 강점은?',['작은 팀에서 고객 문의를 직접 처리한 경험.','해외에서 10년 근무.','제품을 혼자 개발.','면접관과 친분.'],0,'경력은 짧지만 관련 실무 경험이 있습니다.','','경력 길이보다 관련성이 중요합니다.'),q('면접 뒤 지호의 느낌은?',['완벽하지 않아도 경험을 솔직히 전달했어요.','모든 질문에 실패해 포기했어요.','합격 통보를 받았어요.','연결이 좋아 긴장하지 않았어요.'],0,'마지막 문장은 완벽함과 솔직한 전달을 대비합니다.','','긍정적인 성찰입니다.')]}
];

q('지원자가 많기는 하지만 자격을 갖춘 사람은 많지 않다.',['지원자 수와 적격자 수를 구분한다.','지원자가 많으니 모두 적격이다.','조건을 가정한다.','자격은 필요 없다.'],0,'첫 수를 인정하고 다른 기준의 제한을 덧붙입니다.','','두 집단 기준이 다릅니다.'),
q('수정: 도시는 작기는 하지만 교통이 편하더라도.',['그 도시는 작기는 하지만 교통이 편리해요.','작더라도 교통이 편리하더라도.','작아서 교통이 편리해요.','작기는 해서 교통이 편리해요.'],0,'사실 묘사의 두 절을 완성합니다.','','-더라도는 조건절로 남아 부자연스럽습니다.'),
q('데이터가 부족한 보고서에서 신중한 표현?',['효과가 있기는 하지만 장기 결과는 더 확인해야 합니다.','효과가 있더라도 결과는 확정됐습니다.','효과가 있어서 더 확인할 필요 없습니다.','효과가 없는데 결과는 확실합니다.'],0,'관찰된 효과를 인정하고 장기 결론의 한계를 명시합니다.','','확정되지 않은 것을 확정하지 않습니다.'),
q('-기는 하지만 / -더라도의 핵심 차이?',['전자는 사실 인정 대조, 후자는 가정적 양보 조건에 잘 맞는다.','둘 다 원인이다.','전자는 명령, 후자는 과거다.','의미 차이가 없다.'],0,'사실 인정과 가정 조건의 차이를 기억하세요.','','문맥에 따라 구별합니다.'),
q('고객 리뷰: 배송이 빠르기는 하지만 포장은 약했어요. 가장 정확한 요약?',['배송 속도는 장점이고 포장은 개선점이다.','빠른 배송이 약한 포장의 원인이다.','배송이 빠를지 가정한다.','배송과 포장이 모두 완벽하다.'],0,'두 서비스 특징을 나누어 평가합니다.','','원인 표지가 없습니다.')];
data.warm=warm;data.fill=fills;data.dialog=dialogs;data.meaning=meaning;data.traps=traps;data.texts=readings.flatMap(x=>x.qs);data.stories=stories.flatMap(x=>x.qs);data.boss=boss;
const examples=[['가격이 비싸기는 하지만 품질이 좋아요.','Цена высокая, но качество хорошее.','Цена уступает качеству.'],['한국어를 오래 공부하기는 했지만 뉴스는 아직 어려워요.','Я давно учу корейский, но новости пока трудны.','Реальный опыт не отменяет сложность новостей.'],['그 식당은 유명하기는 하지만 예약하기 어려워요.','Ресторан известный, но столик трудно забронировать.','Популярность сочетается с неудобством.'],['집이 작기는 하지만 햇빛이 잘 들어요.','Дом небольшой, зато в него хорошо попадает солнце.','Недостаток площади уравновешен достоинством.'],['회의가 길기는 했지만 중요한 결정을 내렸어요.','Совещание было долгим, но мы приняли важное решение.','Прошлая длительность и значимый результат.'],['학생이기는 하지만 실무 경험도 많아요.','Я студент, но у меня много практического опыта.','Статус не исключает опыта.'],['이 앱은 편하기는 하지만 개인정보 설정이 복잡해요.','Приложением удобно пользоваться, но настройки приватности сложны.','Плюс и практическое ограничение.'],['날씨가 춥기는 하지만 산책할 만해요.','Холодно, но для прогулки вполне подходит.','Неприятный факт не отменяет план.'],['동료가 도와주기는 했지만 마지막 보고서는 제가 썼어요.','Коллега помог, но итоговый отчёт написал я.','Помощь была; авторство уточняется.'],['그 영화는 조용하기는 하지만 오래 생각하게 돼요.','Фильм неспешный, но надолго остаётся в мыслях.','Темп противопоставлен впечатлению.']];
let st={section:'theory',idx:0,answers:{},wrong:[],mode:'normal',sel:null};try{let z=JSON.parse(localStorage.getItem('hangul-lab-v1'));if(z&&z.answers)st={...st,...z,section:'theory',idx:0,mode:'normal',sel:null}}catch(e){}const $=s=>document.querySelector(s);function save(){try{localStorage.setItem('hangul-lab-v1',JSON.stringify(st))}catch(e){}}function done(){return Object.keys(st.answers).length}function update(){let p=Math.round(done()/total*100);$('#fill').style.width=p+'%';$('#pct').textContent=p+'%';$('#score').textContent=`${done()} / ${total} заданий`;$('#sideProgress').textContent=`Проверено ${done()} из ${total} вопросов`}function sectionComplete(id){let a=data[id]||[];return id!=='theory'&&id!=='review'&&a.length>0&&a.every((_,i)=>!!st.answers[id+String.fromCharCode(58)+i])}function nextSection(){let i=sections.findIndex(x=>x[0]===st.section),n=sections.slice(i+1).find(x=>x[0]!=='review');if(n)go(n[0]);else if(st.wrong.length)go('review');else location.href='index.html'}function nav(){let n=$('#nav');n.innerHTML='';sections.forEach(([id,name,count])=>{let b=document.createElement('button');b.className=st.section===id?'active':'';b.innerHTML=`${sectionComplete(id)?'✓ ':''}${name}<small>${id==='review'?st.wrong.length:count}</small>`;b.onclick=()=>go(id);n.append(b)})}function go(id){st.section=id;st.idx=0;st.mode='normal';st.sel=null;save();nav();render();window.scrollTo({top:0,behavior:'smooth'})}function key(s,i){return s+':'+i}function getList(){if(st.mode==='review')return st.review.map(k=>{let [s,i]=k.split(':');return{s,i:+i,q:data[s][+i]}});return(data[st.section]||[]).map((q,i)=>({s:st.section,i,q}))}
function theory(){return `<section class="panel"><span class="tag">Смысл и употребление</span><h2>Признать факт — добавить оговорку</h2><p class="lead"><b>-기는 하지만</b> выражает уступительно-противительное отношение: говорящий подтверждает первую характеристику как реальную или справедливую, но показывает, что она не отменяет вторую. По-русски: «хотя…, но…», «…да, однако…».</p><div class="cols"><article class="card"><h3>Когда и зачем</h3><p>Для взвешенной оценки, тактичного несогласия, компромисса или признания части аргумента. Первая часть часто уже известна; новая позиция обычно во второй.</p><p><b>Оттенок:</b> мягкая уступка, сдержанное признание, иногда дипломатичность. Форма не обязательно резкая или негативная.</p></article><article class="card"><h3>Формула образования</h3><div class="formula">основа + 기는 하지만</div><p><b>Глагол:</b> 읽다 → 읽기는 하지만<br><b>Прилагательное:</b> 작다 → 작기는 하지만; 편리하다 → 편리하기는 하지만<br><b>Прошедшее:</b> 하기는 했지만 (обычно естественно для завершённого действия)<br><b>Сущ. с 받침:</b> 학생이기는 하지만<br><b>Сущ. без 받침:</b> 의사이기는 하지만. В разговорной речи возможны стяжения; полная форма наглядна.</p></article></div><h3>Сравнение</h3><div class="grid"><article class="card"><b>-지만</b><p>Компактное, нейтральное «но». 비싸지만 좋아요. В -기는 하지만 заметнее: «да, это дорого, но…».</p></article><article class="card"><b>-는데</b><p>Часто задаёт фон, вводит пояснение или мягкий переход; иногда по контексту даёт контраст. Уступительное признание выражено менее явно.</p></article><article class="card"><b>-더라도</b><p>«Даже если…»: гипотетическое или обобщённое условие. 비가 오더라도 갈 거예요 — даже если пойдёт дождь, пойду.</p></article><article class="card"><b>Особенности</b><p>Обе части должны быть логически связаны. Вторая часть часто содержит главную позицию. Для реально случившегося события используйте прошедшее, если нужно.</p></article></div><h3>Естественные примеры</h3><div class="grid">${examples.map(x=>`<article class="card"><div class="ko">${x[0]}</div><div>${x[1]}</div><div class="muted">${x[2]}</div></article>`).join('')}</div><div class="actions"><button class="btn primary" onclick="go('warm')">Начать разминку →</button></div></section>`}
function render(){update();nav();let c=$('#content');if(st.section==='theory'){c.innerHTML=theory();return}if(st.section==='review'){st.mode='review';if(!st.wrong.length){c.innerHTML='<section class="panel"><h2>Ошибок для повтора нет 🎉</h2><p>Ошибочные вопросы будут собираться автоматически.</p><button class="btn primary" onclick="go(\'warm\')">К разминке</button></section>';return}}if(st.section==='texts'||st.section==='stories'){special(c);return}question(c)}
function question(c){let list=getList();if(!list.length){c.innerHTML='<section class="panel"><h2>В этом разделе пока нет заданий.</h2></section>';return}st.idx=Math.min(st.idx,list.length-1);let it=list[st.idx],k=key(it.s,it.i),saved=st.answers[k],x=it.q;c.innerHTML=`<section class="panel"><div class="qhead"><span class="tag">${st.mode==='review'?'Повтор ошибок':sections.find(a=>a[0]===st.section)[1]}</span><span class="muted">${st.idx+1} из ${list.length}</span></div><p class="muted">${x.ctx||'Выберите наиболее естественный вариант с учётом контекста.'}</p><div class="prompt">${x.prompt}</div><div class="choices">${x.opts.map((o,i)=>`<button class="choice ${saved?(i===x.ans?'correct':i===saved.pick?'wrong':''):''} ${!saved&&st.sel===i?'selected':''}" ${saved?'disabled':''} onclick="pick(${i})"><span class="letter">${'ABCD'[i]}</span><span>${o}</span></button>`).join('')}</div>${saved?`<div class="feedback ${saved.ok?'good':'bad'}"><h3>${saved.ok?'Верно! Отлично заметили оттенок.':'Разберём нюанс.'}</h3><p><b>Ответ:</b> ${x.opts[x.ans]}</p><p>${x.why}</p>${x.near?`<p><b>Близкие варианты:</b> ${x.near}</p>`:''}</div>`:''}<div class="actions"><button class="btn ghost" onclick="prev()" ${st.idx===0?'disabled':''}>← Назад</button>${saved?`<button class="btn primary" onclick="next()">${st.idx===list.length-1?'Итог':'Дальше →'}</button>`:`<button class="btn primary" onclick="check()" ${st.sel===null?'disabled':''}>Проверить</button>`}<button class="btn secondary" onclick="go('review')">Повторить ошибки (${st.wrong.length})</button></div></section>`}
function pick(i){st.sel=i;render()}function grade(s,i,x,pick){let k=key(s,i),ok=pick===x.ans;st.answers[k]={pick,ok};st.wrong=st.wrong.filter(a=>a!==k);if(!ok)st.wrong.push(k);st.sel=null;save();render()}function check(){let it=getList()[st.idx];if(it&&st.sel!==null)grade(it.s,it.i,it.q,st.sel)}function prev(){if(st.idx>0){st.idx--;st.sel=null;render()}}function next(){let a=getList();if(st.idx<a.length-1){st.idx++;st.sel=null;render()}else if(st.mode==='review'){$('#content').innerHTML=`<section class="panel"><h2>Повтор завершён</h2><div class="actions"><button class="btn primary" onclick="go('warm')">Продолжить урок</button><a class="btn ghost" href="index.html">Все темы</a></div></section>`}else{$('#content').innerHTML=`<section class="panel"><span class="tag">✓ Раздел пройден</span><h2>Хорошая работа!</h2><p>Все задания раздела завершены.</p><div class="actions"><button class="btn primary" onclick="nextSection()">Перейти к следующему разделу →</button><button class="btn secondary" onclick="go('review')">Повторить ошибки (${st.wrong.length})</button></div></section>`}}function special(c){let isT=st.section==='texts',items=isT?readings:stories,ix=Math.floor(st.idx/3),sub=st.idx%3,e=items[ix],x=e.qs[sub],i=ix*3+sub,k=key(st.section,i),saved=st.answers[k];c.innerHTML=`<section class="panel"><div class="qhead"><span class="tag">${e.title}</span><span class="muted">${st.idx+1} из ${items.length*3}</span></div><div lang="ko" class="textblock">${e.body}</div><p class="muted">Факты · функция грамматики · вывод</p><div class="prompt">${x.prompt}</div><div class="choices">${x.opts.map((o,n)=>`<button class="choice ${saved?(n===x.ans?'correct':n===saved.pick?'wrong':''):''} ${!saved&&st.sel===n?'selected':''}" ${saved?'disabled':''} onclick="pick(${n})"><span class="letter">${'ABCD'[n]}</span><span>${o}</span></button>`).join('')}</div>${saved?`<div class="feedback ${saved.ok?'good':'bad'}"><h3>${saved.ok?'Верно!':'Разберём ответ'}</h3><p><b>Ответ:</b> ${x.opts[x.ans]}</p><p>${x.why}</p><p><b>Другие варианты:</b> ${x.near}</p></div>`:''}<div class="actions"><button class="btn ghost" onclick="prev()" ${st.idx===0?'disabled':''}>← Назад</button>${saved?`<button class="btn primary" onclick="next()">${st.idx===items.length*3-1?'Итог':'Дальше →'}</button>`:`<button class="btn primary" onclick="specialCheck()" ${st.sel===null?'disabled':''}>Проверить</button>`}<button class="btn secondary" onclick="go('review')">Ошибки (${st.wrong.length})</button></div></section>`;}
function specialCheck(){let isT=st.section==='texts',items=isT?readings:stories,ix=Math.floor(st.idx/3),sub=st.idx%3,x=items[ix].qs[sub];if(st.sel!==null)grade(st.section,ix*3+sub,x,st.sel)}if(!st.shuffleV2){for(const [k,a] of Object.entries(st.answers||{})){const [sec,idx]=k.split(':');const x=(data[sec]||[])[Number(idx)];if(x){a.pick=a.ok?x.ans:(x.ans+1)%x.opts.length}}st.shuffleV2=true;save()}nav();render();
</script></body></html>
