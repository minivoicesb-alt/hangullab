order-radius:16px}.ko{font-size:19px;font-weight:720;line-height:1.6}.muted{color:var(--muted);font-size:14px}.tag{display:inline-block;background:#fff0f5;color:#a52c5a;border-radius:99px;padding:3px 9px;font-size:12px;font-weight:750}.formula{font-size:17px;font-weight:800;background:#fff1f6;padding:10px;border-radius:12px;display:inline-block}.qhead{display:flex;justify-content:space-between;align-items:center}.prompt{font-size:20px;font-weight:740;line-height:1.5;margin:14px 0}.choices{display:grid;gap:8px}.choice{display:flex;gap:10px;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:11px 13px;color:var(--ink)}.choice:hover{border-color:#ee8eaf}.choice.selected{border-color:var(--pink);background:#fff2f7}.choice.correct{border-color:#6bbd96;background:#f0fbf5}.choice.wrong{border-color:#e78594;background:#fff3f3}.letter{width:24px;height:24px;flex:none;border-radius:8px;background:#f6edf1;text-align:center;font-weight:800;font-size:13px}.feedback{margin-top:14px;padding:14px;border-radius:14px;background:#f5f2ff;border:1px solid #e7dffc}.feedback.good{background:#effaf4;border-color:#ccebd9}.feedback.bad{background:#fff4f2;border-color:#f6d8d4}.feedback h3{margin:0}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}.btn{border:0;border-radius:12px;padding:10px 15px;font-weight:760}.primary{background:linear-gradient(100deg,var(--pink),#dc4b9f);color:white}.secondary{background:#f7edf2;color:#665465}.ghost{background:transparent;color:#7a6978;border:1px solid var(--line)}.btn:disabled{opacity:.45;cursor:not-allowed}.textblock{font-size:17px;line-height:1.85;background:#fff8fb;border:1px solid var(--line);border-radius:15px;padding:16px}.notice{padding:12px;border-radius:12px;background:#f7f3ff;color:#655a7c;font-size:14px;margin-top:14px}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{padding:12px;background:white;border:1px solid var(--line);border-radius:14px}.stat strong{font-size:23px;display:block}.footer{t </style></head><body><div class="shell"><header class="top"><div class="brand">✿ <b>Hangul</b> Lab</div><a class="switch" href="index.html">← Все темы</a> <a class="switch" href="gineun.html">Урок -기는 하지만</a></header><div class="layout"><aside class="side"><h3>Маршрут урока</h3><nav class="nav" id="nav"></nav><div class="notice" id="sideProgress"></div></aside><main><section class="hero"><div class="eyebrow">Корейская грамматика · TOPIK I–II</div><h1>-(으)ㄴ/는데도</h1><p>Выражайте факт и результат вопреки ожиданию: «несмотря на то что…, всё равно…».</p><div class="progress"><div class="track"><div class="fill" id="fill"></div></div><b id="pct">0%</b><span id="score" class="muted">0 / 129 заданий</span></div></section><div id="content"></div></main></div><div class="footer">Автономно · прогресс хранится в этом браузере</div></div><script>
const sections=[['theory','Теория',10],['warm','Разминка',15],['fill','Заполни пропуск',15],['dialog','Диалоги',15],['error','Исправь ошибку',10],['meaning','Перевод смысла',10],['texts','Тексты',9],['stories','Мини-истории',15],['traps','Ловушки',10],['boss','Boss Battle',30],['review','Повтор ошибок','↻']],total=129,data={};let answerShuffleCounter=0;const q=(prompt,opts,ans,why,ctx='',near='')=>{const n=opts.length,target=answerShuffleCounter++%n,mixed=Array(n);mixed[target]=opts[ans];let j=0;for(let i=0;i<n;i++){if(i===ans)continue;while(j===target)j++;mixed[j++]=opts[i]}return{prompt,opts:mixed,ans:target,why,ctx,near}};
const bank=[
['오늘은 먼저 갈게요. 내일 아침에 발표가 있거든요.','Я сегодня уйду пораньше: завтра утром у меня доклад.','거든요 в конце объясняет причину ухода, добавляя важную для собеседника информацию.','Друг зовёт задержаться после работы.','глагол настоящего времени + 거든요'],
['창문을 닫아 주세요. 바람이 차갑거든요.','Закройте, пожалуйста, окно: ветер холодный.','Причина просьбы сообщается в конце мягко и естественно.','В комнате сквозит.','прилагательное + 거든요'],
['이번 주말에는 못 만나요. 친척들이 집에 오거든요.','На этих выходных не смогу встретиться: ко мне приедут родственники.','Окончание поясняет отказ новой причиной.','Друг предлагает встретиться.','глагол + 거든요'],
['저 식당을 추천해요. 점심 메뉴가 괜찮거든요.','Рекомендую тот ресторан: там хорошие обеды.','Говорящий обосновывает рекомендацию в конце реплики.','Коллега спрашивает, где пообедать.','прилагательное + 거든요'],
['오늘은 버스를 탔어요. 지하철역이 공사 중이거든요.','Сегодня я поехал на автобусе: станция метро на ремонте.','Вторая часть объясняет уже упомянутый выбор транспорта.','Друг заметил, что вы приехали на автобусе.','существительное + 이거든요'],
['그 책을 빌려 드릴게요. 설명이 쉽거든요.','Дам вам эту книгу: в ней простые объяснения.','Пояснение поддерживает предложение помочь.','Новичок ищет учебник.','прилагательное + 거든요'],
['회의 내용을 공유할게요. 민지가 오늘 참석하지 못하거든요.','Я поделюсь итогами встречи: Минджи сегодня не сможет прийти.','Причина будущего действия сообщается собеседнику как новая информация.','Коллега просит протокол.','глагол + 거든요'],
['답장이 늦어서 미안해. 휴대전화 배터리가 없었거든.','Извини за поздний ответ: у телефона разрядился аккумулятор.','Разговорное 거든 объясняет прошлую причину; в вежливой речи будет 거든요.','Друг спрашивает о задержке.','прошедшее + 거든요'],
['저는 매운 음식을 잘 못 먹어요. 어릴 때부터 입맛이 순하거든요.','Я плохо ем острое: с детства привык к мягкому вкусу.','Вторая часть даёт личное объяснение, новое для собеседника.','Заказывают ужин.','описательное пояснение + 거든요'],
['그 앱을 삭제했어요. 알림이 너무 자주 오거든요.','Я удалил это приложение: уведомления приходили слишком часто.','Конец предложения обосновывает принятое решение.','Обсуждают смартфоны.','глагол + 거든요'],
['오늘은 택시를 타야겠어요. 짐이 많거든요.','Сегодня, пожалуй, поеду на такси: багажа много.','Краткая причина поясняет решение в контексте.','Собираются в аэропорт.','прилагательное + 거든요'],
['그분은 새 팀장님이세요. 이번 달에 오셨거든요.','Это новый руководитель команды: он пришёл в этом месяце.','Говорящий добавляет пояснительную информацию.','Собеседник не узнаёт коллегу.','прошедший глагол + 거든요'],
['사진은 나중에 보내 줄게요. 지금 인터넷이 느리거든요.','Фотографии пришлю позже: сейчас интернет медленный.','Причина обещанного переноса дана в финале.','Отправка фото не проходит.','прилагательное + 거든요'],
['저는 매주 수영해요. 허리가 자주 아프거든요.','Я каждую неделю плаваю: у меня часто болит спина.','Пояснение связывает привычку с личной причиной.','Разговор о здоровье и спорте.','глагол + 거든요'],
['오늘은 조용히 이야기해요. 아기가 자고 있거든요.','Давайте сегодня говорить потише: ребёнок спит.','Добавленная причина объясняет просьбу собеседнику.','Гости пришли домой.','глагольное выражение + 거든요']
];
const warm=bank.map(b=>q(`В ситуации «${b[3]}» что означает реплика «${b[0]}»?`,['В конце сообщается пояснение/причина, важная для собеседника.','Говорящий задаёт условие: «если…».','Говорящий напоминает общий известный факт с укором.','Говорящий только перечисляет два несвязанных события.'],0,b[2],b[1],'-거든요 в конце реплики даёт пояснение; условное -거든 обычно требует продолжения.' ));
const fill=bank.map((b,i)=>q(`Выберите естественное завершение реплики: ${b[0].replace(/거든요\.?|거든\.?/,'____')}`,['거든요',i%2?'잖아요':'는데요','더라도','반면에'],0,`${b[2]} Разговорное объяснение причины в конце высказывания — -거든요.`,b[3],'-잖아요 обычно апеллирует к общему знанию; -는데요 вводит фон/мягкое продолжение.' ));
const dialog=bank.map(b=>q(`A: 오늘은 왜 그렇게 해요? B: ${b[0]}`,['B добавляет причину или нужную фоновую информацию.','B ставит условие для будущего действия.','B упрекает A за забытый общий факт.','B сравнивает два человека.'],0,b[2],b[3],'Здесь -거든요 объясняет реплику, а не выражает условие или упрёк.'));
const error=bank.slice(0,10).map((b,i)=>q('Выберите пояснительную форму, а не условие: '+b[0].replace('거든요','____'),['거든요','거든','잖아요','더라도'],0,b[2],b[3],'Условное 거든 требует продолжения; пояснительное 거든요 завершает реплику.'));
const meaning=bank.slice(0,10).map(b=>q(`Выберите точный перевод: ${b[0]}`,[b[1],b[1].replace(':',', но'), 'Если это произойдёт, говорящий сделает что-то другое.','Собеседник уже знает эту причину, и говорящий упрекает его.'],0,`${b[2]} Естественный перевод передаёт пояснительную причину, добавленную в конце.`,b[3],'-거든요 не обязательно выражает упрёк или условие.'));
const traps=bank.slice(0,10).map((b,i)=>q(`Контекст: ${b[3]} Какая форма даёт новое объяснение в конце реплики?`,['-거든요','-거든 (условное)','-잖아요','-더라도'],0,`${b[2]} Это пояснение адресату, а не условие и не напоминание об общем знании.`,b[0],'-거든 условное требует главной части; -잖아요 подразумевает известность; -더라도 значит «даже если».'));
data.warm=warm;data.fill=fill;data.dialog=dialog;data.error=error;data.meaning=meaning;data.traps=traps;const readings=[
{title:'Текст 1 · TOPIK 2 · Общение в офисе',body:'민지는 새 회사에서 일한 지 한 달이 되었다. 팀원들은 업무를 도와주지만 회의에서 사용하는 약어가 아직 낯설다. 어느 날 민지는 회의 내용을 잘못 이해해 자료를 다시 만들었다. 선배는 회의가 끝난 뒤 민지에게 중요한 용어 목록을 보냈다. 민지는 고맙다고 말하며 자신이 약어를 잘 모른다고 설명했다. 선배는 처음에는 누구나 헷갈린다고 했다. 다음 날 민지는 회의 전에 질문을 준비했다. 팀장은 발표 순서를 바꾸겠다고 했는데, 외부 손님이 조금 늦게 도착하거든요. 민지는 이유를 듣고 새 순서를 팀원들에게 알려 주었다. 퇴근할 때 선배는 업무 메시지에 설명을 덧붙이면 오해를 줄일 수 있다고 조언했다. 민지는 짧은 이유 한마디가 협업을 편하게 만든다는 점을 배웠다. 민지는 팀원들과 함께 다음 회의도 준비하기로 했다.',qs:[q('Почему руководитель изменил порядок презентации?',['외부 손님이 늦게 도착하기 때문이에요.','민지가 약어를 몰라서요.','선배가 회사를 떠나서요.','자료가 모두 완성되지 않아서요.'],0,'본문에서 팀장이 외부 손님의 도착이 늦는다고 설명합니다.','','다른 이유는 나오지 않습니다.'),q('Зачем 팀장은 -거든요를 사용했나요?',['Чтобы объяснить новую причину изменения расписания.','Чтобы поставить условие для будущей встречи.','Чтобы упрекнуть команду за забывчивость.','Чтобы сравнить двух гостей.'],0,'В конце сообщается новая для команды причина.','','Это не условное -거든 и не напоминание -잖아요.'),q('Какую мысль Минджи усвоила к концу текста?',['Краткое пояснение может сделать совместную работу понятнее.','Вопросы на встречах всегда мешают работе.','Новые сотрудники должны молчать.','Любой график нужно менять каждый день.'],0,'Последнее предложение прямо формулирует вывод.','','Остальные обобщения не поддержаны текстом.') ]},
{title:'Текст 2 · TOPIK 3 · План поездки',body:'유진과 친구들은 주말에 바닷가로 여행을 가기로 했다. 출발 전날 유진은 단체 대화방에 기차표를 사진으로 올렸다. 좌석이 떨어져 있거든요. 친구들은 처음에는 왜 표를 따로 샀는지 몰랐지만, 유진이 상황을 설명하자 다른 열차를 알아보았다. 한 친구는 오전에 일이 있어서 조금 늦게 출발한다고 했다. 유진은 먼저 도착하면 근처 시장에서 기다리겠다고 답했다. 여행 당일 비가 내렸지만 바닷가 버스는 정상적으로 운행했다. 기사님은 "도로가 미끄럽거든요. 천천히 가겠습니다."라고 안내했다. 친구들은 안내를 듣고 서두르지 않았다. 도착한 뒤에는 비가 약해져 해변을 걸었다. 계획이 처음과 달라졌는데도 모두 즐겁게 시간을 보냈다. 유진은 이유를 미리 공유하면 갑작스러운 변경도 쉽게 받아들일 수 있다고 생각했다. 여행이 끝난 뒤 친구들은 사진을 공유하고 다음에 가고 싶은 장소도 함께 정했다.',qs:[q('Почему Юджин отправила фото билетов в чат?',['좌석이 떨어져 있어서요.','기차가 취소되어서요.','친구가 표를 잃어버려서요.','바닷가 버스가 없어서요.'],0,'Текст прямо объясняет, что места были раздельными.','','Остальные причины не упомянуты.'),q('Что объяснил водитель автобуса?',['도로가 미끄러워 천천히 가겠다고 했어요.','비가 그쳐서 빨리 가겠다고 했어요.','시장에 들르겠다고 했어요.','버스가 운행하지 않는다고 했어요.'],0,'Скользкая дорога стала причиной осторожного движения.','','Это объяснение, не условие.'),q('Какой вывод следует из истории поездки?',['Если заранее сообщить причину, изменения легче принять.','Планы никогда не нужно менять.','В дождь транспорт всегда отменяют.','Друзья не хотят путешествовать вместе.'],0,'Последняя мысль текста говорит о ценности пояснений.','','Итог поездки был положительным.') ]},
{title:'Текст 3 · TOPIK 4 · Учебный проект',body:'대학 연구팀은 지역 상점의 온라인 홍보 방법을 조사하고 있다. 학생들은 매주 가게 주인을 만나 인터뷰를 진행한다. 이번 주에는 한 가게가 약속 시간에 문을 열지 않았다. 주인은 전화로 사과하며 오늘은 오전에 납품을 기다리고 있거든요라고 설명했다. 학생들은 일정을 바꾸어 오후에 다시 방문했다. 인터뷰에서 주인은 광고를 자주 올리지만 사진을 찍을 사람이 없다고 말했다. 한 학생은 동아리 친구가 사진 촬영을 도울 수 있다고 제안했다. 연구팀은 자료가 충분하지 않거든요. 그래서 결론을 미루기보다 다음 주에 다른 가게도 만나기로 했다. 지도 교수는 설명을 들을 때 사실과 개인 의견을 구별하라고 강조했다. 프로젝트 보고서에는 가게의 사정과 연구팀의 선택을 각각 정리할 예정이다. 학생들은 짧은 이유를 듣는 것도 현장을 이해하는 데 중요한 자료가 된다고 배웠다.',qs:[q('Почему владелец магазина не открылся к назначенному времени?',['납품을 기다리고 있었어요.','인터뷰를 취소하고 싶었어요.','사진을 찍고 있었어요.','학생들을 잊었어요.'],0,'Владелец объяснил, что ждал поставку.','','Остальные причины не указаны.'),q('Как команда поступила после объяснения?',['오후에 다시 방문했어요.','연구를 바로 끝냈어요.','다른 지역으로 이사했어요.','결론을 이미 확정했어요.'],0,'Студенты перенесли визит на послеобеденное время.','','Они продолжают сбор данных.'),q('Чему учит текст о -거든요?',['Оно может добавлять контекст, который помогает понять поступок.','Оно всегда доказывает, что причина объективно верна.','Оно заменяет проверку данных.','Оно используется только в письмах.'],0,'Пояснение даёт контекст; профессор отдельно просит отличать факт от мнения.','','Окончание не гарантирует истинность причины само по себе.') ]}
];data.texts=readings.flatMap(r=>r.qs);
const stories=[
{title:'Мини-история 1 · Забытый ключ',body:'수아는 퇴근 후 친구 집에 가기로 했다. 약속 시간에 늦을 것 같아 먼저 메시지를 보냈다. 집 열쇠를 두고 나왔거든요. 친구는 근처 카페에서 기다리겠다고 했다. 수아가 도착했을 때 친구는 이미 따뜻한 차를 주문해 두었다. 둘은 사소한 실수 때문에 웃으며 이야기를 나누었다.',qs:[q('Почему Суа задержалась?',['열쇠를 두고 나왔어요.','버스를 놓쳤어요.','친구 집을 못 찾았어요.','카페가 문을 닫았어요.'],0,'Она объяснила, что оставила ключ дома.','','Другие причины отсутствуют.'),q('Зачем она написала другу заранее?',['Причина задержки была важна для планов друга.','Она хотела отменить встречу.','Она просила новый ключ.','Она сообщала общий известный факт.'],0,'Пояснение помогает другу решить, где ждать.','','Это новая практическая информация.'),q('Как друзья отреагировали?',['기다리며 차를 마시고 함께 웃었어요.','화가 나서 돌아갔어요.','만나지 않았어요.','열쇠를 찾으러 갔어요.'],0,'В конце они спокойно встретились и посмеялись.','','Ссоры в тексте нет.')]},
{title:'Мини-история 2 · Тихая библиотека',body:'도서관 직원은 학생들에게 조용히 해 달라고 부탁했다. 옆방에서 온라인 시험을 보고 있거든요. 학생들은 이어폰을 끼고 대화를 밖에서 계속했다. 시험이 끝난 뒤 직원은 고맙다고 인사했다. 한 학생은 안내문에 이유도 적어 두면 방문객들이 더 잘 이해할 것 같다고 말했다. 다음 날 도서관은 문 앞에 짧은 설명을 붙였다.',qs:[q('Почему библиотекарь попросил говорить тише?',['옆방에서 온라인 시험을 보고 있었어요.','도서관이 곧 문을 닫았어요.','학생들이 책을 빌리지 않았어요.','직원이 시험을 봤어요.'],0,'Причина просьбы сообщена в конце.','','Не закрытие библиотеки.'),q('Как студенты отреагировали?',['밖에서 대화하고 이어폰을 사용했어요.','시험을 중단했어요.','도서관을 나가서 돌아오지 않았어요.','안내문을 떼었어요.'],0,'Они перенесли разговор за пределы комнаты.','','Их поведение было уважительным.'),q('Что добавило бы объяснение на табличке?',['방문객이 요청의 이유를 알 수 있어요.','시험 결과를 바꿔요.','도서관을 더 크게 만들어요.','이어폰을 없애요.'],0,'Короткая причина помогает посетителям понять просьбу.','','Это предложение персонажа.') ]},
{title:'Мини-история 3 · Перенесённая встреча',body:'민호는 동료와 점심 약속을 바꾸고 싶었다. 오늘은 고객을 만나야 하거든요. 동료는 처음에 아쉬워했지만 오후에 시간이 있다고 답했다. 민호는 새 시간을 달력에 적고 식당도 예약했다. 고객 미팅은 예상보다 일찍 끝났다. 두 사람은 약속한 시간에 만나 새 프로젝트에 대해 이야기했다.',qs:[q('Почему Минхо попросил изменить время?',['고객을 만나야 했어요.','식당이 문을 닫았어요.','동료가 늦었어요.','달력을 잃어버렸어요.'],0,'Он должен был встретиться с клиентом.','','Это объясняет перенос.'),q('Что помогло коллеге понять просьбу?',['민호가 일정 변경 이유를 말했어요.','민호가 약속을 취소했어요.','식당이 전화했어요.','고객이 동료에게 연락했어요.'],0,'Причина была сообщена в реплике.','','Контекст разговора это подтверждает.'),q('Чем закончилась встреча?',['두 사람은 새 시간에 만나 프로젝트를 이야기했어요.','둘 다 약속에 오지 않았어요.','민호는 고객과만 점심을 먹었어요.','식당 예약이 취소됐어요.'],0,'Они встретились в новое время.','','Перенос сработал.') ]},
{title:'Мини-история 4 · Подарок',body:'지현은 동생에게 책을 선물했다. 동생이 요즘 요리를 배우고 있거든요. 책 안에는 쉬운 조리법과 사진이 많았다. 동생은 이미 같은 책이 있는 줄 알고 잠깐 웃었다. 하지만 자세히 보니 새로 나온 개정판이었다. 지현은 동생이 자주 만드는 음식에 표시를 해 두었다. 둘은 주말에 책을 보며 저녁을 함께 만들기로 했다.',qs:[q('Почему Джихён выбрала кулинарную книгу?',['동생이 요리를 배우고 있어요.','동생이 책을 싫어해요.','지현이 이사를 가요.','책이 할인 중이었어요.'],0,'Причина выбора подарка дана в первой части.','','Другие причины не названы.'),q('Как подарок оказался новым для брата/сестры?',['개정판이었어요.','요리책이 아니었어요.','사진이 없었어요.','책을 이미 읽었어요.'],0,'Это обновлённое издание.','','Сначала он ошибочно подумал, что книга та же.'),q('Почему подарок особенно личный?',['자주 만드는 음식에 표시를 해 두었어요.','책을 비싼 포장지로 쌌어요.','동생에게 요리를 가르치지 않았어요.','책을 다른 사람에게 주었어요.'],0,'Даритель отметил рецепты, которые любит готовить младший.','','Это показывает внимание.') ]},
{title:'Мини-история 5 · Ранний поезд',body:'하린은 아침 일찍 역에 도착했다. 첫 기차를 타야 하거든요. 역 안 가게들은 아직 문을 열지 않았다. 하린은 벤치에 앉아 발표 자료를 다시 읽었다. 옆자리에 앉은 여행객이 어느 승강장인지 물었다. 하린은 표를 확인해 알려 주었다. 기차가 도착하자 두 사람은 서로 인사하고 각자 자리에 올랐다.',qs:[q('Почему Харин приехала рано?',['첫 기차를 타야 했어요.','가게에서 일해야 했어요.','발표가 취소됐어요.','역을 청소해야 했어요.'],0,'Она объясняет ранний приезд необходимостью успеть на первый поезд.','','В тексте нет другой причины.'),q('Чем Харин помогла путешественнику?',['승강장 정보를 알려 주었어요.','표를 대신 샀어요.','짐을 옮겼어요.','기차를 세웠어요.'],0,'Она посмотрела билет и подсказала платформу.','','Это небольшой дружелюбный поступок.'),q('Какую функцию выполняет -거든요 в начале?',['Объясняет, почему Харин приехала так рано.','Сравнивает Харин и путешественника.','Ставит условие для поезда.','Выражает упрёк.'],0,'Объяснение в начале даёт контекст её поведения.','','Это нейтральная причина, не упрёк.') ]}
];data.stories=stories.flatMap(s=>s.qs);
const boss=[...data.warm.slice(0,5),...data.fill.slice(0,5),...data.dialog.slice(0,5),...data.error.slice(0,5),...data.meaning.slice(0,5),...data.traps.slice(0,5)].map((x,i)=>({...x,prompt:`Boss ${i+1} · ${x.prompt}`}));data.boss=boss;
const examples=[['오늘은 먼저 갈게요. 내일 아침에 발표가 있거든요.','Я сегодня уйду пораньше: завтра утром доклад.','Финальное 거든요 объясняет причину ухода.'],['창문을 닫아 주세요. 바람이 차갑거든요.','Закройте, пожалуйста, окно: ветер холодный.','Добавляет причину просьбы.'],['이번 주말에는 못 만나요. 친척들이 집에 오거든요.','На выходных не смогу встретиться: приедут родственники.','Новая для собеседника причина отказа.'],['저 식당을 추천해요. 점심 메뉴가 괜찮거든요.','Рекомендую тот ресторан: там хорошие обеды.','Обосновывает рекомендацию.'],['오늘은 버스를 탔어요. 지하철역이 공사 중이거든요.','Сегодня я поехал на автобусе: станция метро на ремонте.','Объясняет выбор транспорта.'],['그 책을 빌려 드릴게요. 설명이 쉽거든요.','Дам вам эту книгу: объяснения простые.','Поясняет предложение помочь.'],['회의 내용을 공유할게요. 민지가 참석하지 못하거든요.','Я поделюсь итогами: Минджи не сможет прийти.','Объясняет действие контекстом.'],['답장이 늦어서 미안해. 배터리가 없었거든.','Извини, что поздно ответил: разрядился телефон.','Разговорное 거든 объясняет прошлую причину.'],['저는 매운 음식을 잘 못 먹어요. 입맛이 순하거든요.','Я плохо ем острое: привык к мягкому вкусу.','Личное пояснение новой информации.'],['오늘은 택시를 타야겠어요. 짐이 많거든요.','Сегодня поеду на такси: багажа много.','Обосновывает принятое решение.']];
function theory(){return `<section class="panel"><span class="tag">Пояснение · разговорная речь</span><h2>Добавьте причину в конце реплики</h2><p class="lead"><b>-거든요</b> — разговорное пояснительное окончание. Говорящий сообщает причину, обстоятельство или новую информацию, помогающую понять предыдущую реплику: «дело в том, что…», «просто…», «потому что…». Обычно стоит в конце самостоятельного высказывания.</p><div class="cols"><article class="card"><h3>Когда и зачем</h3><p>Объяснить отказ, выбор, просьбу, изменение планов или сообщить контекст, которого собеседник не знает. Тон часто дружелюбный и объяснительный; сам по себе -거든요 не означает упрёк.</p><p>Можно начать с причины ради контекста: 첫 기차를 타야 하거든요. — Мне нужно на первый поезд, понимаете.</p></article><article class="card"><h3>Форма</h3><div class="formula">основа + 거든요</div><p><b>Глагол/прилагательное:</b> 가다 → 가거든요; 춥다 → 춥거든요<br><b>Прошедшее:</b> 없었다 → 없었거든요<br><b>Сущ. с 받침:</b> 학생이거든요<br><b>Сущ. без 받침:</b> 의사거든요<br>В неформальной речи часто опускают 요: 바쁘거든. Интонация важна, но форма обычно мягко объясняет.</p></article></div><h3>С чем не путать</h3><div class="grid"><article class="card"><b>Условное -거든</b><p>Одинаково звучит без 요, но условное -거든 обычно требует продолжения: 시간 있거든 전화해. — Если будет время, позвони. Пояснительное -거든요 завершает объяснение.</p></article><article class="card"><b>-(으)니까 / -아/어서</b><p>Обычно связывают причину и следствие внутри высказывания. -거든요 часто добавляет отдельное объяснение к уже сказанной реплике.</p></article><article class="card"><b>-잖아요</b><p>Напоминает о факте, который говорящий считает общим знанием: 알잖아요. -거든요 чаще вводит пояснение, которое адресату нужно сообщить.</p></article><article class="card"><b>-는데요</b><p>Даёт фон, смягчает или оставляет реплику открытой. -거든요 яснее обозначает объяснение/основание.</p></article></div><h3>Примеры</h3><div class="grid">${examples.map(x=>`<article class="card"><div class="ko">${x[0]}</div><div>${x[1]}</div><div class="muted">${x[2]}</div></article>`).join('')}</div><div class="actions"><button class="btn primary" onclick="go('warm')">Начать разминку →</button></div></section>`}
let st={section:'theory',idx:0,answers:{},wrong:[],mode:'normal',sel:null};try{let saved=JSON.parse(localStorage.getItem('hangul-lab-geodeunyo-v1'));if(saved&&saved.answers)st={...st,...saved,section:'theory',idx:0,mode:'normal',sel:null}}catch(e){}const $=s=>document.querySelector(s);function save(){try{localStorage.setItem('hangul-lab-geodeunyo-v1',JSON.stringify(st))}catch(e){}}function done(){return Object.keys(st.answers).length}function update(){let p=Math.round(done()/total*100);$('#fill').style.width=p+'%';$('#pct').textContent=p+'%';$('#score').textContent=`${done()} / ${total}`;$('#sideProgress').textContent=`Проверено ${done()} из ${total} заданий`}function sectionComplete(id){let a=data[id]||[];return id!=='theory'&&id!=='review'&&a.length>0&&a.every((_,i)=>!!st.answers[id+String.fromCharCode(58)+i])}function nextSection(){let i=sections.findIndex(x=>x[0]===st.section),n=sections.slice(i+1).find(x=>x[0]!=='review');if(n)go(n[0]);else if(st.wrong.length)go('review');else location.href='index.html'}function nav(){let n=$('#nav');n.innerHTML='';sections.forEach(([id,name,num])=>{let b=document.createElement('button');b.className=st.section===id?'active':'';b.innerHTML=`${sectionComplete(id)?'✓ ':''}${name}<small>${id==='review'?st.wrong.length:num}</small>`;b.onclick=()=>go(id);n.append(b)})}function go(id){st.section=id;st.idx=0;st.sel=null;st.mode='normal';if(id==='review')st.review=[...st.wrong];save();render();window.scrollTo({top:0,behavior:'smooth'})}function list(){return st.mode==='review'?st.review.map(k=>{let[s,i]=k.split(':');return{s,i:+i,q:data[s][+i]}}):(data[st.section]||[]).map((q,i)=>({s:st.section,i,q}))}function render(){update();nav();let c=$('#content');if(st.section==='theory'){c.innerHTML=theory();return}if(st.section==='review'){st.mode='review';if(!st.wrong.length){c.innerHTML='<section class="panel"><h2>Ошибок для повтора нет 🎉</h2><button class="btn primary" onclick="go(\'warm\')">К разминке</button></section>';return}}if(st.section==='texts'||st.section==='stories'){special(c);return}question(c)}function question(c){let a=list();st.idx=Math.min(st.idx,a.length-1);let it=a[st.idx],k=it.s+':'+it.i,saved=st.answers[k],x=it.q;c.innerHTML=`<section class="panel"><div class="qhead"><span class="tag">${st.mode==='review'?'Повтор ошибок':sections.find(v=>v[0]===st.section)[1]}</span><span>${st.idx+1} из ${a.length}</span></div><p class="muted">${x.ctx||'Выберите наиболее точный ответ с учётом контекста.'}</p><div class="prompt">${x.prompt}</div><div class="choices">${x.opts.map((o,i)=>`<button class="choice ${saved?(i===x.ans?'correct':i===saved.pick?'wrong':''):''} ${!saved&&st.sel===i?'selected':''}" ${saved?'disabled':''} onclick="pick(${i})"><span class="letter">${'ABCD'[i]}</span>${o}</button>`).join('')}</div>${saved?`<div class="feedback ${saved.ok?'good':'bad'}"><b>${saved.ok?'Верно!':'Разберём ответ.'}</b><p>${x.why}</p><p>${x.near}</p></div>`:''}<div class="actions"><button class="btn ghost" onclick="prev()" ${st.idx===0?'disabled':''}>← Назад</button>${saved?`<button class="btn primary" onclick="next()">Дальше →</button>`:`<button class="btn primary" onclick="check()" ${st.sel===null?'disabled':''}>Проверить</button>`}<button class="btn secondary" onclick="go('review')">Ошибки (${st.wrong.length})</button></div></section>`}function pick(i){st.sel=i;render()}function grade(s,i,x,p){let k=s+':'+i,ok=p===x.ans;st.answers[k]={pick:p,ok};st.wrong=st.wrong.filter(v=>v!==k);if(!ok)st.wrong.push(k);st.sel=null;save();render()}function check(){let x=list()[st.idx];if(x)grade(x.s,x.i,x.q,st.sel)}function prev(){if(st.idx>0){st.idx--;render()}}function next(){let a=list();if(st.idx<a.length-1){st.idx++;st.sel=null;render()}else if(st.mode==='review'){$('#content').innerHTML=`<section class="panel"><h2>Повтор завершён</h2><div class="actions"><button class="btn primary" onclick="go('warm')">Продолжить урок</button><a class="btn ghost" href="index.html">Все темы</a></div></section>`}else{$('#content').innerHTML=`<section class="panel"><span class="tag">✓ Раздел пройден</span><h2>Хорошая работа!</h2><p>Все задания раздела завершены.</p><div class="actions"><button class="btn primary" onclick="nextSection()">Перейти к следующему разделу →</button><button class="btn secondary" onclick="go('review')">Повторить ошибки (${st.wrong.length})</button></div></section>`}}function special(c){let t=st.section==='texts',a=t?readings:stories,n=Math.floor(st.idx/3),j=st.idx%3,e=a[n],x=e.qs[j],i=n*3+j,k=st.section+':'+i,saved=st.answers[k];c.innerHTML=`<section class="panel"><div class="qhead"><span class="tag">${e.title}</span><span>${st.idx+1} из ${a.length*3}</span></div><div class="textblock" lang="ko">${e.body}</div><p class="muted">Факты · функция окончания · вывод</p><div class="prompt">${x.prompt}</div><div class="choices">${x.opts.map((o,z)=>`<button class="choice ${saved?(z===x.ans?'correct':z===saved.pick?'wrong':''):''} ${!saved&&st.sel===z?'selected':''}" ${saved?'disabled':''} onclick="pick(${z})"><span class="letter">${'ABCD'[z]}</span>${o}</button>`).join('')}</div>${saved?`<div class="feedback ${saved.ok?'good':'bad'}"><b>${saved.ok?'Верно!':'Разберём ответ.'}</b><p>${x.why}</p><p>${x.near}</p></div>`:''}<div class="actions"><button class="btn ghost" onclick="prev()" ${st.idx===0?'disabled':''}>← Назад</button>${saved?`<button class="btn primary" onclick="next()">Дальше →</button>`:`<button class="btn primary" onclick="specialCheck()" ${st.sel===null?'disabled':''}>Проверить</button>`}</div></section>`}function specialCheck(){let t=st.section==='texts',a=t?readings:stories,n=Math.floor(st.idx/3),j=st.idx%3;if(st.sel!==null)grade(st.section,n*3+j,a[n].qs[j],st.sel)}if(!st.shuffleV2){for(const [k,a] of Object.entries(st.answers||{})){const [sec,idx]=k.split(':');const x=(data[sec]||[])[Number(idx)];if(x){a.pick=a.ok?x.ans:(x.ans+1)%x.opts.length}}st.shuffleV2=true;save()}nav();render();
</script>
